# splat config for the EBOOT (module modehsys, the shared engine every
# gmodule PRX imports as libehsys_rel) — full file coverage.
#
# Input is the DECRYPTED EBOOT, build/EBOOT.elf (scripts/decrypt_eboot.sh;
# sha1 cc92ddd45f550ac1b906842d587c883fba22be34, listed in checksums.sha1).
# Once decrypted it is the same kind of PRX as the gmodule ones (e_type
# 0xFFA0, loaded at base 0), so this mirrors config/rel_movie_viewer.yaml,
# including its gotchas: `header` is its own top-level segment, and .text +
# .sceStub.text stay in ONE code segment based at file 0x54 / vram 0x0 so that
# func_XXXXXXXX names are vram addresses.
#
# Symbols: config/symbols/modehsys.txt, generated by
# `scripts/prx_to_rea_elf.py --splat-symbols`. It names the 1729 libehsys_rel
# exports exactly as every module's import stubs call them (ehsys_memset,
# ehsys_get_language, ehsys_ACAC5C40, ...), plus the EBOOT's own SDK imports.
# A function some module already calls by name therefore has that name here.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000000-0x000054  ELF header + program header
#   0x000054-0x06DED0  .text                    (0x6DE7C)
#   0x06DED0-0x06E968  .sceStub.text            (0xA98)
#   0x06E968-0x06EC14  .lib.ent* + .lib.stub*   (export/import tables)
#   0x06EC14-0x0724E4  .rodata.sceModuleInfo + .rodata.sceResident
#   0x0724E4-0x07304C  .rodata.sceNid           (0xB68)
#   0x07304C-0x152E84  .data                    (0xDFE38; also holds the constants)
#   0x152E84-0x18090C  section header table + .rel.* + .shstrtab + .comment
# .bss is declared with size 0; its real extent is the PT_LOAD memsz
# (vram 0x152E30-0x59A600, 4.4 MB) and it has no file bytes.
#
# Ranges sum to 0x18090C == 1575180 == the file's exact size.

name: modehsys
sha1: cc92ddd45f550ac1b906842d587c883fba22be34
options:
  platform: psp
  basename: modehsys
  base_path: ..
  target_path: build/EBOOT.elf
  asm_path: asm/modehsys
  asset_path: assets/modehsys
  ld_script_path: build/modehsys.ld
  symbol_addrs_path: config/symbols/modehsys.txt
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program header, file 0x0-0x54
  - name: modehsys
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54,     asm, text]          # vram 0x0-0x6DE7C: the engine code to decompile
      - [0x6DED0,  asm, sceStub_text]  # vram 0x6DE7C-0x6E914: SDK import-stub trampolines
      - [0x6E968,  bin, lib_tables]    # .lib.ent* + .lib.stub*
      - [0x6EC14,  bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0x724E4,  bin, sceNid]        # .rodata.sceNid
      - [0x7304C,  bin, data]          # .data
      - [0x152E84, bin, elf_meta]      # section header table + .rel.* + .shstrtab + .comment
  - [0x18090C]   # sentinel: total file size
