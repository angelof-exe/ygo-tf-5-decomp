# splat config for rel_charalist.prx — full file coverage.
#
# Generated by scripts/module_survey.py; see config/rel_movie_viewer.yaml
# for the hand-written original this mirrors, including the two gotchas
# encoded here: `header` must be its own top-level segment (splat groups
# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x008DE4  .text                    (0x8D90)
#   0x008DE4-0x00C3EC  .sceStub.text            (0x3608)
#   0x00C3EC-0x00C3F0  .lib.ent.top             (0x4)
#   0x00C3F0-0x00C410  .lib.ent                 (0x20)
#   0x00C410-0x00C414  .lib.ent.btm             (0x4)
#   0x00C414-0x00C418  .lib.stub.top            (0x4)
#   0x00C418-0x00C430  .lib.stub                (0x18)
#   0x00C430-0x00C434  .lib.stub.btm            (0x4)
#   0x00C434-0x00C468  .rodata.sceModuleInfo    (0x34)
#   0x00C468-0x00C4F4  .rodata.sceResident      (0x8C)
#   0x00C4F4-0x00DFF8  .rodata.sceNid           (0x1B04)
#   0x00DFF8-0x025E14  .data                    (0x17E1C)
#   0x025E14-0x029EA4  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0x29EA4 == 171684 == the file's exact size.

name: rel_charalist
sha1: 2f68f634f2018ba2fa46060472366ac713bae6b3
options:
  platform: psp
  basename: rel_charalist
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_charalist.prx
  asm_path: asm/rel_charalist
  asset_path: assets/rel_charalist   # per-module, or all 28 overwrite each other
  ld_script_path: build/rel_charalist.ld
  symbol_addrs_path: config/symbols/rel_charalist.txt   # import stub names (scripts/resolve_nids.py)
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program headers, file 0x0-0x54
  - name: rel_charalist
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x8D90: the code to decompile
      - [0x8DE4, asm, sceStub_text]  # vram 0x8D90-0xC398: import-stub trampolines
      - [0xC3EC, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0xC434, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0xC4F4, bin, sceNid]   # .rodata.sceNid
      - [0xDFF8, bin, data]   # .data
      - [0x25E14, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0x29EA4]   # sentinel: total file size
