# splat config for rel_conv_machine.prx — full file coverage.
#
# Generated by scripts/module_survey.py; see config/rel_movie_viewer.yaml
# for the hand-written original this mirrors, including the two gotchas
# encoded here: `header` must be its own top-level segment (splat groups
# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x003700  .text                    (0x36AC)
#   0x003700-0x006D38  .sceStub.text            (0x3638)
#   0x006D38-0x006D3C  .lib.ent.top             (0x4)
#   0x006D3C-0x006D5C  .lib.ent                 (0x20)
#   0x006D5C-0x006D60  .lib.ent.btm             (0x4)
#   0x006D60-0x006D64  .lib.stub.top            (0x4)
#   0x006D64-0x006D90  .lib.stub                (0x2C)
#   0x006D90-0x006D94  .lib.stub.btm            (0x4)
#   0x006D94-0x006DC8  .rodata.sceModuleInfo    (0x34)
#   0x006DC8-0x006E28  .rodata.sceResident      (0x60)
#   0x006E28-0x008944  .rodata.sceNid           (0x1B1C)
#   0x008944-0x009084  .data                    (0x740)
#   0x009084-0x00B784  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0xB784 == 46980 == the file's exact size.

name: rel_conv_machine
sha1: 20db4f703185e50fe30a66f161bb8d0750569530
options:
  platform: psp
  basename: rel_conv_machine
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_conv_machine.prx
  asm_path: asm/rel_conv_machine
  asset_path: assets/rel_conv_machine   # per-module, or all 28 overwrite each other
  ld_script_path: build/rel_conv_machine.ld
  symbol_addrs_path: config/symbols/rel_conv_machine.txt   # import stub names (scripts/resolve_nids.py)
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program headers, file 0x0-0x54
  - name: rel_conv_machine
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x36AC: the code to decompile
      - [0x3700, asm, sceStub_text]  # vram 0x36AC-0x6CE4: import-stub trampolines
      - [0x6D38, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0x6D94, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0x6E28, bin, sceNid]   # .rodata.sceNid
      - [0x8944, bin, data]   # .data
      - [0x9084, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0xB784]   # sentinel: total file size
