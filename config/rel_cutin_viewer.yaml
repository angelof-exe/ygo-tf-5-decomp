      - [0x20158, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0x201A0, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
