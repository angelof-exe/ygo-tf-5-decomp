#   0x020184-0x02019C  .lib.stub                (0x18)
#   0x02019C-0x0201A0  .lib.stub.btm            (0x4)
#   0x0201A0-0x0201D4  .rodata.sceModuleInfo    (0x34)
#   0x0201D4-0x020204  .rodata.sceResident      (0x30)
#   0x020204-0x021D08  .rodata.sceNid           (0x1B04)
#   0x021D08-0x021D68  .rodata.sceVstub         (0x60)
#   0x021D68-0x025AD4  .data                    (0x3D6C)
#   0x025AD4-0x02F2E0  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0x2F2E0 == 193248 == the file's exact size.

name: rel_cutin_viewer
