# splat config for rel_debug_menu.prx — full file coverage.
#
# Generated by scripts/module_survey.py; see config/rel_movie_viewer.yaml
# for the hand-written original this mirrors, including the two gotchas
# encoded here: `header` must be its own top-level segment (splat groups
# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x00406C  .text                    (0x4018)
#   0x00406C-0x007674  .sceStub.text            (0x3608)
#   0x007674-0x007678  .lib.ent.top             (0x4)
#   0x007678-0x007698  .lib.ent                 (0x20)
#   0x007698-0x00769C  .lib.ent.btm             (0x4)
#   0x00769C-0x0076A0  .lib.stub.top            (0x4)
#   0x0076A0-0x0076B8  .lib.stub                (0x18)
#   0x0076B8-0x0076BC  .lib.stub.btm            (0x4)
#   0x0076BC-0x0076F0  .rodata.sceModuleInfo    (0x34)
#   0x0076F0-0x007724  .rodata.sceResident      (0x34)
#   0x007724-0x009228  .rodata.sceNid           (0x1B04)
#   0x009228-0x009CE4  .data                    (0xABC)
#   0x009CE4-0x00CFD4  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0xCFD4 == 53204 == the file's exact size.

name: rel_debug_menu
sha1: a989a16846726d49f5fdd5f4f1e11f96171dfe4e
options:
  platform: psp
  basename: rel_debug_menu
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_debug_menu.prx
  asm_path: asm/rel_debug_menu
  asset_path: assets/rel_debug_menu   # per-module, or all 28 overwrite each other
  ld_script_path: build/rel_debug_menu.ld
  symbol_addrs_path: config/symbols/rel_debug_menu.txt   # import stub names (scripts/resolve_nids.py)
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program headers, file 0x0-0x54
  - name: rel_debug_menu
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x4018: the code to decompile
      - [0x406C, asm, sceStub_text]  # vram 0x4018-0x7620: import-stub trampolines
      - [0x7674, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0x76BC, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0x7724, bin, sceNid]   # .rodata.sceNid
      - [0x9228, bin, data]   # .data
      - [0x9CE4, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0xCFD4]   # sentinel: total file size
