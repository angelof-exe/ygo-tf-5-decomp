# splat config for rel_deck.prx — full file coverage.
#
# Generated by scripts/module_survey.py; see config/rel_movie_viewer.yaml
# for the hand-written original this mirrors, including the two gotchas
# encoded here: `header` must be its own top-level segment (splat groups
# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x0242FC  .text                    (0x242A8)
#   0x0242FC-0x02793C  .sceStub.text            (0x3640)
#   0x02793C-0x027940  .lib.ent.top             (0x4)
#   0x027940-0x027960  .lib.ent                 (0x20)
#   0x027960-0x027964  .lib.ent.btm             (0x4)
#   0x027964-0x027968  .lib.stub.top            (0x4)
#   0x027968-0x0279BC  .lib.stub                (0x54)
#   0x0279BC-0x0279C0  .lib.stub.btm            (0x4)
#   0x0279C0-0x0279F4  .rodata.sceModuleInfo    (0x34)
#   0x0279F4-0x027A5C  .rodata.sceResident      (0x68)
#   0x027A5C-0x02962C  .rodata.sceNid           (0x1BD0)
#   0x02962C-0x02D034  .data                    (0x3A08)
#   0x02D034-0x03CA54  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0x3CA54 == 248404 == the file's exact size.

name: rel_deck
sha1: 9779bb6775e20f87e32b9da682aac1abbdec016c
options:
  platform: psp
  basename: rel_deck
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_deck.prx
  asm_path: asm/rel_deck
  asset_path: assets/rel_deck   # per-module, or all 28 overwrite each other
  ld_script_path: build/rel_deck.ld
  symbol_addrs_path: config/symbols/rel_deck.txt   # import stub names (scripts/resolve_nids.py)
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program headers, file 0x0-0x54
  - name: rel_deck
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x242A8: the code to decompile
      - [0x242FC, asm, sceStub_text]  # vram 0x242A8-0x278E8: import-stub trampolines
      - [0x2793C, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0x279C0, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0x27A5C, bin, sceNid]   # .rodata.sceNid
      - [0x2962C, bin, data]   # .data
      - [0x2D034, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0x3CA54]   # sentinel: total file size
