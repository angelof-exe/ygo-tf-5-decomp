# splat config for rel_deckswap.prx — full file coverage.
#
# Generated by scripts/module_survey.py; see config/rel_movie_viewer.yaml
# for the hand-written original this mirrors, including the two gotchas
# encoded here: `header` must be its own top-level segment (splat groups
# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x017F40  .text                    (0x17EEC)
#   0x017F40-0x01B738  .sceStub.text            (0x37F8)
#   0x01B738-0x01B73C  .lib.ent.top             (0x4)
#   0x01B73C-0x01B75C  .lib.ent                 (0x20)
#   0x01B75C-0x01B760  .lib.ent.btm             (0x4)
#   0x01B760-0x01B764  .lib.stub.top            (0x4)
#   0x01B764-0x01B790  .lib.stub                (0x2C)
#   0x01B790-0x01B794  .lib.stub.btm            (0x4)
#   0x01B794-0x01B7C8  .rodata.sceModuleInfo    (0x34)
#   0x01B7C8-0x01B828  .rodata.sceResident      (0x60)
#   0x01B828-0x01D424  .rodata.sceNid           (0x1BFC)
#   0x01D424-0x01E334  .data                    (0xF10)
#   0x01E334-0x02762C  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0x2762C == 161324 == the file's exact size.

name: rel_deckswap
sha1: 686e917502d3fabc3b34b150e489a63e171e178b
options:
  platform: psp
  basename: rel_deckswap
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_deckswap.prx
  asm_path: asm/rel_deckswap
  asset_path: assets/rel_deckswap   # per-module, or all 28 overwrite each other
  ld_script_path: build/rel_deckswap.ld
  symbol_addrs_path: config/symbols/rel_deckswap.txt   # import stub names (scripts/resolve_nids.py)
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program headers, file 0x0-0x54
  - name: rel_deckswap
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x17EEC: the code to decompile
      - [0x17F40, asm, sceStub_text]  # vram 0x17EEC-0x1B6E4: import-stub trampolines
      - [0x1B738, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0x1B794, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0x1B828, bin, sceNid]   # .rodata.sceNid
      - [0x1D424, bin, data]   # .data
      - [0x1E334, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0x2762C]   # sentinel: total file size
