# splat config for rel_decktutorial.prx — full file coverage.
#
# Generated by scripts/module_survey.py; see config/rel_movie_viewer.yaml
# for the hand-written original this mirrors, including the two gotchas
# encoded here: `header` must be its own top-level segment (splat groups
# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x021A34  .text                    (0x219E0)
#   0x021A34-0x02503C  .sceStub.text            (0x3608)
#   0x02503C-0x025040  .lib.ent.top             (0x4)
#   0x025040-0x025060  .lib.ent                 (0x20)
#   0x025060-0x025064  .lib.ent.btm             (0x4)
#   0x025064-0x025068  .lib.stub.top            (0x4)
#   0x025068-0x025080  .lib.stub                (0x18)
#   0x025080-0x025084  .lib.stub.btm            (0x4)
#   0x025084-0x0250B8  .rodata.sceModuleInfo    (0x34)
#   0x0250B8-0x025108  .rodata.sceResident      (0x50)
#   0x025108-0x026C0C  .rodata.sceNid           (0x1B04)
#   0x026C0C-0x028D94  .data                    (0x2188)
#   0x028D94-0x036ED4  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0x36ED4 == 224980 == the file's exact size.

name: rel_decktutorial
sha1: 3256332b4c601a5d55cf0bff5fedb09b57db3ec7
options:
  platform: psp
  basename: rel_decktutorial
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_decktutorial.prx
  asm_path: asm/rel_decktutorial
  asset_path: assets/rel_decktutorial   # per-module, or all 28 overwrite each other
  ld_script_path: build/rel_decktutorial.ld
  symbol_addrs_path: config/symbols/rel_decktutorial.txt   # import stub names (scripts/resolve_nids.py)
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program headers, file 0x0-0x54
  - name: rel_decktutorial
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x219E0: the code to decompile
      - [0x21A34, asm, sceStub_text]  # vram 0x219E0-0x24FE8: import-stub trampolines
      - [0x2503C, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0x25084, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0x25108, bin, sceNid]   # .rodata.sceNid
      - [0x26C0C, bin, data]   # .data
      - [0x28D94, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0x36ED4]   # sentinel: total file size
