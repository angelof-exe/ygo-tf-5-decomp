    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x6E704: the code to decompile
      - [0x6E758, asm, sceStub_text]  # vram 0x6E704-0x722F4: import-stub trampolines
      - [0x72348, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0x723B4, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0x7261C, bin, sceNid]   # .rodata.sceNid
      - [0x74414, bin, sceVstub]   # .rodata.sceVstub
      - [0x744B4, bin, data]   # .data
      - [0x7E684, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0xA33F8]   # sentinel: total file size
