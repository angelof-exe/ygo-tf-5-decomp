# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x06E758  .text                    (0x6E704)
#   0x06E758-0x072348  .sceStub.text            (0x3BF0)
#   0x072348-0x07234C  .lib.ent.top             (0x4)
#   0x07234C-0x07237C  .lib.ent                 (0x30)
#   0x07237C-0x072380  .lib.ent.btm             (0x4)
#   0x072380-0x072384  .lib.stub.top            (0x4)
#   0x072384-0x0723B0  .lib.stub                (0x2C)
#   0x0723B0-0x0723B4  .lib.stub.btm            (0x4)
#   0x0723B4-0x0723E8  .rodata.sceModuleInfo    (0x34)
#   0x0723E8-0x07261C  .rodata.sceResident      (0x234)
#   0x07261C-0x074414  .rodata.sceNid           (0x1DF8)
#   0x074414-0x0744B4  .rodata.sceVstub         (0xA0)
#   0x0744B4-0x07E684  .data                    (0xA1D0)
#   0x07E684-0x0A33F8  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0xA33F8 == 668664 == the file's exact size.

name: rel_duel_draw
sha1: 8e8496a7865ab453e0c3d08d068f646cb8488ff1
options:
  platform: psp
  basename: rel_duel_draw
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_duel_draw.prx
  asm_path: asm/rel_duel_draw
  asset_path: assets/rel_duel_draw   # per-module, or all 28 overwrite each other
  ld_script_path: build/rel_duel_draw.ld
  symbol_addrs_path: config/symbols/rel_duel_draw.txt   # import stub names (scripts/resolve_nids.py)
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
