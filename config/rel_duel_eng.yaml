# splat config for rel_duel_eng.prx — full file coverage.
#
# Generated by scripts/module_survey.py; see config/rel_movie_viewer.yaml
# for the hand-written original this mirrors, including the two gotchas
# encoded here: `header` must be its own top-level segment (splat groups
# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x2F6B70  .text                    (0x2F6B1C)
#   0x2F6B70-0x2FA178  .sceStub.text            (0x3608)
#   0x2FA178-0x2FA17C  .lib.ent.top             (0x4)
#   0x2FA17C-0x2FA1BC  .lib.ent                 (0x40)
#   0x2FA1BC-0x2FA1C0  .lib.ent.btm             (0x4)
#   0x2FA1C0-0x2FA1C4  .lib.stub.top            (0x4)
#   0x2FA1C4-0x2FA1DC  .lib.stub                (0x18)
#   0x2FA1DC-0x2FA1E0  .lib.stub.btm            (0x4)
#   0x2FA1E0-0x2FA214  .rodata.sceModuleInfo    (0x34)
#   0x2FA214-0x2FA82C  .rodata.sceResident      (0x618)
#   0x2FA82C-0x2FC330  .rodata.sceNid           (0x1B04)
#   0x2FC330-0x325D84  .data                    (0x29A54)
#   0x325D84-0x424AEC  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0x424AEC == 4344556 == the file's exact size.

name: rel_duel_eng
sha1: 2f98eb03621483407a3bb7b0b61893159ddef4c1
options:
  platform: psp
  basename: rel_duel_eng
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_duel_eng.prx
  asm_path: asm/rel_duel_eng
  asset_path: assets/rel_duel_eng   # per-module, or all 28 overwrite each other
  ld_script_path: build/rel_duel_eng.ld
  symbol_addrs_path: config/symbols/rel_duel_eng.txt   # import stub names (scripts/resolve_nids.py)
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program headers, file 0x0-0x54
  - name: rel_duel_eng
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x2F6B1C: the code to decompile
      - [0x2F6B70, asm, sceStub_text]  # vram 0x2F6B1C-0x2FA124: import-stub trampolines
      - [0x2FA178, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0x2FA1E0, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0x2FA82C, bin, sceNid]   # .rodata.sceNid
      - [0x2FC330, bin, data]   # .data
      - [0x325D84, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0x424AEC]   # sentinel: total file size
