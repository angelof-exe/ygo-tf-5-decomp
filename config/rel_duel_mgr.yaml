# splat config for rel_duel_mgr.prx — full file coverage.
#
# Generated by scripts/module_survey.py; see config/rel_movie_viewer.yaml
# for the hand-written original this mirrors, including the two gotchas
# encoded here: `header` must be its own top-level segment (splat groups
# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x016FE8  .text                    (0x16F94)
#   0x016FE8-0x01AE48  .sceStub.text            (0x3E60)
#   0x01AE48-0x01AE4C  .lib.ent.top             (0x4)
#   0x01AE4C-0x01AE6C  .lib.ent                 (0x20)
#   0x01AE6C-0x01AE70  .lib.ent.btm             (0x4)
#   0x01AE70-0x01AE74  .lib.stub.top            (0x4)
#   0x01AE74-0x01AEDC  .lib.stub                (0x68)
#   0x01AEDC-0x01AEE0  .lib.stub.btm            (0x4)
#   0x01AEE0-0x01AF14  .rodata.sceModuleInfo    (0x34)
#   0x01AF14-0x01AF8C  .rodata.sceResident      (0x78)
#   0x01AF8C-0x01CEBC  .rodata.sceNid           (0x1F30)
#   0x01CEBC-0x01E7B4  .data                    (0x18F8)
#   0x01E7B4-0x0282C4  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0x282C4 == 164548 == the file's exact size.

name: rel_duel_mgr
sha1: f04f43f01a7dce6edcb2e379e66f14ae2dde5406
options:
  platform: psp
  basename: rel_duel_mgr
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_duel_mgr.prx
  asm_path: asm/rel_duel_mgr
  asset_path: assets/rel_duel_mgr   # per-module, or all 28 overwrite each other
  ld_script_path: build/rel_duel_mgr.ld
  symbol_addrs_path: config/symbols/rel_duel_mgr.txt   # import stub names (scripts/resolve_nids.py)
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program headers, file 0x0-0x54
  - name: rel_duel_mgr
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x16F94: the code to decompile
      - [0x16FE8, asm, sceStub_text]  # vram 0x16F94-0x1ADF4: import-stub trampolines
      - [0x1AE48, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0x1AEE0, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0x1AF8C, bin, sceNid]   # .rodata.sceNid
      - [0x1CEBC, bin, data]   # .data
      - [0x1E7B4, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0x282C4]   # sentinel: total file size
