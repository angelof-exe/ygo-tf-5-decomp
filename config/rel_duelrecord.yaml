# splat config for rel_duelrecord.prx — full file coverage.
#
# Generated by scripts/module_survey.py; see config/rel_movie_viewer.yaml
# for the hand-written original this mirrors, including the two gotchas
# encoded here: `header` must be its own top-level segment (splat groups
# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x0049AC  .text                    (0x4958)
#   0x0049AC-0x007FB4  .sceStub.text            (0x3608)
#   0x007FB4-0x007FB8  .lib.ent.top             (0x4)
#   0x007FB8-0x007FD8  .lib.ent                 (0x20)
#   0x007FD8-0x007FDC  .lib.ent.btm             (0x4)
#   0x007FDC-0x007FE0  .lib.stub.top            (0x4)
#   0x007FE0-0x007FF8  .lib.stub                (0x18)
#   0x007FF8-0x007FFC  .lib.stub.btm            (0x4)
#   0x007FFC-0x008030  .rodata.sceModuleInfo    (0x34)
#   0x008030-0x00807C  .rodata.sceResident      (0x4C)
#   0x00807C-0x009B80  .rodata.sceNid           (0x1B04)
#   0x009B80-0x00A1A4  .data                    (0x624)
#   0x00A1A4-0x00C7B4  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0xC7B4 == 51124 == the file's exact size.

name: rel_duelrecord
sha1: f53aac6497bd92606b192bf0fef5056f7b73ded4
options:
  platform: psp
  basename: rel_duelrecord
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_duelrecord.prx
  asm_path: asm/rel_duelrecord
  asset_path: assets/rel_duelrecord   # per-module, or all 28 overwrite each other
  ld_script_path: build/rel_duelrecord.ld
  symbol_addrs_path: config/symbols/rel_duelrecord.txt   # import stub names (scripts/resolve_nids.py)
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program headers, file 0x0-0x54
  - name: rel_duelrecord
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x4958: the code to decompile
      - [0x49AC, asm, sceStub_text]  # vram 0x4958-0x7F60: import-stub trampolines
      - [0x7FB4, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0x7FFC, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0x807C, bin, sceNid]   # .rodata.sceNid
      - [0x9B80, bin, data]   # .data
      - [0xA1A4, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0xC7B4]   # sentinel: total file size
