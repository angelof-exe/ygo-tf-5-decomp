# splat config for rel_field.prx — full file coverage.
#
# Generated by scripts/module_survey.py; see config/rel_movie_viewer.yaml
# for the hand-written original this mirrors, including the two gotchas
# encoded here: `header` must be its own top-level segment (splat groups
# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x037D64  .text                    (0x37D10)
#   0x037D64-0x03B3A4  .sceStub.text            (0x3640)
#   0x03B3A4-0x03B3A8  .lib.ent.top             (0x4)
#   0x03B3A8-0x03B3C8  .lib.ent                 (0x20)
#   0x03B3C8-0x03B3CC  .lib.ent.btm             (0x4)
#   0x03B3CC-0x03B3D0  .lib.stub.top            (0x4)
#   0x03B3D0-0x03B3FC  .lib.stub                (0x2C)
#   0x03B3FC-0x03B400  .lib.stub.btm            (0x4)
#   0x03B400-0x03B434  .rodata.sceModuleInfo    (0x34)
#   0x03B434-0x03B558  .rodata.sceResident      (0x124)
#   0x03B558-0x03D08C  .rodata.sceNid           (0x1B34)
#   0x03D08C-0x04C054  .data                    (0xEFC8)
#   0x04C054-0x06413C  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0x6413C == 409916 == the file's exact size.

name: rel_field
sha1: 28d83a4e892a5d9b784746ef941400506f79d51c
options:
  platform: psp
  basename: rel_field
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_field.prx
  asm_path: asm/rel_field
  asset_path: assets/rel_field   # per-module, or all 28 overwrite each other
  ld_script_path: build/rel_field.ld
  symbol_addrs_path: config/symbols/rel_field.txt   # import stub names (scripts/resolve_nids.py)
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program headers, file 0x0-0x54
  - name: rel_field
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x37D10: the code to decompile
      - [0x37D64, asm, sceStub_text]  # vram 0x37D10-0x3B350: import-stub trampolines
      - [0x3B3A4, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0x3B400, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0x3B558, bin, sceNid]   # .rodata.sceNid
      - [0x3D08C, bin, data]   # .data
      - [0x4C054, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0x6413C]   # sentinel: total file size
