# splat config for rel_gallery.prx — full file coverage.
#
# Generated by scripts/module_survey.py; see config/rel_movie_viewer.yaml
# for the hand-written original this mirrors, including the two gotchas
# encoded here: `header` must be its own top-level segment (splat groups
# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x0045A0  .text                    (0x454C)
#   0x0045A0-0x007BA8  .sceStub.text            (0x3608)
#   0x007BA8-0x007BAC  .lib.ent.top             (0x4)
#   0x007BAC-0x007BCC  .lib.ent                 (0x20)
#   0x007BCC-0x007BD0  .lib.ent.btm             (0x4)
#   0x007BD0-0x007BD4  .lib.stub.top            (0x4)
#   0x007BD4-0x007BEC  .lib.stub                (0x18)
#   0x007BEC-0x007BF0  .lib.stub.btm            (0x4)
#   0x007BF0-0x007C24  .rodata.sceModuleInfo    (0x34)
#   0x007C24-0x007C64  .rodata.sceResident      (0x40)
#   0x007C64-0x0098A0  .rodata.sceNid           (0x1C3C)
#   0x0098A0-0x00A894  .data                    (0xFF4)
#   0x00A894-0x00C884  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0xC884 == 51332 == the file's exact size.

name: rel_gallery
sha1: 769291b4129e21563c898f2e46da60161b75c6df
options:
  platform: psp
  basename: rel_gallery
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_gallery.prx
  asm_path: asm/rel_gallery
  asset_path: assets/rel_gallery   # per-module, or all 28 overwrite each other
  ld_script_path: build/rel_gallery.ld
  symbol_addrs_path: config/symbols/rel_gallery.txt   # import stub names (scripts/resolve_nids.py)
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program headers, file 0x0-0x54
  - name: rel_gallery
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x454C: the code to decompile
      - [0x45A0, asm, sceStub_text]  # vram 0x454C-0x7B54: import-stub trampolines
      - [0x7BA8, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0x7BF0, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0x7C64, bin, sceNid]   # .rodata.sceNid
      - [0x98A0, bin, data]   # .data
      - [0xA894, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0xC884]   # sentinel: total file size
