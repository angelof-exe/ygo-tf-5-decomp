# splat config for rel_labo.prx — full file coverage.
#
# Generated by scripts/module_survey.py; see config/rel_movie_viewer.yaml
# for the hand-written original this mirrors, including the two gotchas
# encoded here: `header` must be its own top-level segment (splat groups
# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x00133C  .text                    (0x12E8)
#   0x00133C-0x004A7C  .sceStub.text            (0x3740)
#   0x004A7C-0x004A80  .lib.ent.top             (0x4)
#   0x004A80-0x004AA0  .lib.ent                 (0x20)
#   0x004AA0-0x004AA4  .lib.ent.btm             (0x4)
#   0x004AA4-0x004AA8  .lib.stub.top            (0x4)
#   0x004AA8-0x004B74  .lib.stub                (0xCC)
#   0x004B74-0x004B78  .lib.stub.btm            (0x4)
#   0x004B78-0x004BAC  .rodata.sceModuleInfo    (0x34)
#   0x004BAC-0x004C88  .rodata.sceResident      (0xDC)
#   0x004C88-0x006828  .rodata.sceNid           (0x1BA0)
#   0x006828-0x00AE44  .data                    (0x461C)
#   0x00AE44-0x00CE6C  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0xCE6C == 52844 == the file's exact size.

name: rel_labo
sha1: 1a0b57a3137bc7a5467c7f8b9121cbbe2156afb2
options:
  platform: psp
  basename: rel_labo
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_labo.prx
  asm_path: asm/rel_labo
  asset_path: assets/rel_labo   # per-module, or all 28 overwrite each other
  ld_script_path: build/rel_labo.ld
  symbol_addrs_path: config/symbols/rel_labo.txt   # import stub names (scripts/resolve_nids.py)
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program headers, file 0x0-0x54
  - name: rel_labo
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x12E8: the code to decompile
      - [0x133C, asm, sceStub_text]  # vram 0x12E8-0x4A28: import-stub trampolines
      - [0x4A7C, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0x4B78, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0x4C88, bin, sceNid]   # .rodata.sceNid
      - [0x6828, bin, data]   # .data
      - [0xAE44, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0xCE6C]   # sentinel: total file size
