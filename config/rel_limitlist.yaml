# splat config for rel_limitlist.prx — full file coverage.
#
# Generated by scripts/module_survey.py; see config/rel_movie_viewer.yaml
# for the hand-written original this mirrors, including the two gotchas
# encoded here: `header` must be its own top-level segment (splat groups
# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x0058CC  .text                    (0x5878)
#   0x0058CC-0x008ED4  .sceStub.text            (0x3608)
#   0x008ED4-0x008ED8  .lib.ent.top             (0x4)
#   0x008ED8-0x008EF8  .lib.ent                 (0x20)
#   0x008EF8-0x008EFC  .lib.ent.btm             (0x4)
#   0x008EFC-0x008F00  .lib.stub.top            (0x4)
#   0x008F00-0x008F18  .lib.stub                (0x18)
#   0x008F18-0x008F1C  .lib.stub.btm            (0x4)
#   0x008F1C-0x008F50  .rodata.sceModuleInfo    (0x34)
#   0x008F50-0x008F9C  .rodata.sceResident      (0x4C)
#   0x008F9C-0x00AAA0  .rodata.sceNid           (0x1B04)
#   0x00AAA0-0x00B124  .data                    (0x684)
#   0x00B124-0x00DA84  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0xDA84 == 55940 == the file's exact size.

name: rel_limitlist
sha1: 9cb77d29adecb28cae2cb8620259b026ae79715a
options:
  platform: psp
  basename: rel_limitlist
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_limitlist.prx
  asm_path: asm/rel_limitlist
  asset_path: assets/rel_limitlist   # per-module, or all 28 overwrite each other
  ld_script_path: build/rel_limitlist.ld
  symbol_addrs_path: config/symbols/rel_limitlist.txt   # import stub names (scripts/resolve_nids.py)
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program headers, file 0x0-0x54
  - name: rel_limitlist
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x5878: the code to decompile
      - [0x58CC, asm, sceStub_text]  # vram 0x5878-0x8E80: import-stub trampolines
      - [0x8ED4, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0x8F1C, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0x8F9C, bin, sceNid]   # .rodata.sceNid
      - [0xAAA0, bin, data]   # .data
      - [0xB124, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0xDA84]   # sentinel: total file size
