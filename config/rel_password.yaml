# splat config for rel_password.prx — full file coverage.
#
# Generated by scripts/module_survey.py; see config/rel_movie_viewer.yaml
# for the hand-written original this mirrors, including the two gotchas
# encoded here: `header` must be its own top-level segment (splat groups
# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x00380C  .text                    (0x37B8)
#   0x00380C-0x006E14  .sceStub.text            (0x3608)
#   0x006E14-0x006E18  .lib.ent.top             (0x4)
#   0x006E18-0x006E38  .lib.ent                 (0x20)
#   0x006E38-0x006E3C  .lib.ent.btm             (0x4)
#   0x006E3C-0x006E40  .lib.stub.top            (0x4)
#   0x006E40-0x006E58  .lib.stub                (0x18)
#   0x006E58-0x006E5C  .lib.stub.btm            (0x4)
#   0x006E5C-0x006E90  .rodata.sceModuleInfo    (0x34)
#   0x006E90-0x006ED8  .rodata.sceResident      (0x48)
#   0x006ED8-0x0089DC  .rodata.sceNid           (0x1B04)
#   0x0089DC-0x008A1C  .rodata.sceVstub         (0x40)
#   0x008A1C-0x008C94  .data                    (0x278)
#   0x008C94-0x00B6B8  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0xB6B8 == 46776 == the file's exact size.

name: rel_password
sha1: d0b6b3fdbe8d5625304def63361593244d3de21b
options:
  platform: psp
  basename: rel_password
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_password.prx
  asm_path: asm/rel_password
  asset_path: assets/rel_password   # per-module, or all 28 overwrite each other
  ld_script_path: build/rel_password.ld
  symbol_addrs_path: config/symbols/rel_password.txt   # import stub names (scripts/resolve_nids.py)
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program headers, file 0x0-0x54
  - name: rel_password
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x37B8: the code to decompile
      - [0x380C, asm, sceStub_text]  # vram 0x37B8-0x6DC0: import-stub trampolines
      - [0x6E14, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0x6E5C, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0x6ED8, bin, sceNid]   # .rodata.sceNid
      - [0x89DC, bin, sceVstub]   # .rodata.sceVstub
      - [0x8A1C, bin, data]   # .data
      - [0x8C94, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0xB6B8]   # sentinel: total file size
