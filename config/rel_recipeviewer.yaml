# splat config for rel_recipeviewer.prx — full file coverage.
#
# Generated by scripts/module_survey.py; see config/rel_movie_viewer.yaml
# for the hand-written original this mirrors, including the two gotchas
# encoded here: `header` must be its own top-level segment (splat groups
# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x008B40  .text                    (0x8AEC)
#   0x008B40-0x00C148  .sceStub.text            (0x3608)
#   0x00C148-0x00C14C  .lib.ent.top             (0x4)
#   0x00C14C-0x00C16C  .lib.ent                 (0x20)
#   0x00C16C-0x00C170  .lib.ent.btm             (0x4)
#   0x00C170-0x00C174  .lib.stub.top            (0x4)
#   0x00C174-0x00C18C  .lib.stub                (0x18)
#   0x00C18C-0x00C190  .lib.stub.btm            (0x4)
#   0x00C190-0x00C1C4  .rodata.sceModuleInfo    (0x34)
#   0x00C1C4-0x00C214  .rodata.sceResident      (0x50)
#   0x00C214-0x00DD18  .rodata.sceNid           (0x1B04)
#   0x00DD18-0x00E3D4  .data                    (0x6BC)
#   0x00E3D4-0x0120F4  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0x120F4 == 73972 == the file's exact size.

name: rel_recipeviewer
sha1: b656a8fc751cc9f5c2461a7e9803f6d9ea21b94a
options:
  platform: psp
  basename: rel_recipeviewer
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_recipeviewer.prx
  asm_path: asm/rel_recipeviewer
  asset_path: assets/rel_recipeviewer   # per-module, or all 28 overwrite each other
  ld_script_path: build/rel_recipeviewer.ld
  symbol_addrs_path: config/symbols/rel_recipeviewer.txt   # import stub names (scripts/resolve_nids.py)
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program headers, file 0x0-0x54
  - name: rel_recipeviewer
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x8AEC: the code to decompile
      - [0x8B40, asm, sceStub_text]  # vram 0x8AEC-0xC0F4: import-stub trampolines
      - [0xC148, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0xC190, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0xC214, bin, sceNid]   # .rodata.sceNid
      - [0xDD18, bin, data]   # .data
      - [0xE3D4, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0x120F4]   # sentinel: total file size
