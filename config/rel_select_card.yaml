# splat config for rel_select_card.prx — full file coverage.
#
# Generated by scripts/module_survey.py; see config/rel_movie_viewer.yaml
# for the hand-written original this mirrors, including the two gotchas
# encoded here: `header` must be its own top-level segment (splat groups
# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x0184A0  .text                    (0x1844C)
#   0x0184A0-0x01BAA8  .sceStub.text            (0x3608)
#   0x01BAA8-0x01BAAC  .lib.ent.top             (0x4)
#   0x01BAAC-0x01BACC  .lib.ent                 (0x20)
#   0x01BACC-0x01BAD0  .lib.ent.btm             (0x4)
#   0x01BAD0-0x01BAD4  .lib.stub.top            (0x4)
#   0x01BAD4-0x01BAEC  .lib.stub                (0x18)
#   0x01BAEC-0x01BAF0  .lib.stub.btm            (0x4)
#   0x01BAF0-0x01BB24  .rodata.sceModuleInfo    (0x34)
#   0x01BB24-0x01BB88  .rodata.sceResident      (0x64)
#   0x01BB88-0x01D68C  .rodata.sceNid           (0x1B04)
#   0x01D68C-0x01E624  .data                    (0xF98)
#   0x01E624-0x027DF4  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0x27DF4 == 163316 == the file's exact size.

name: rel_select_card
sha1: 654f1a24f46c5a3066364c93ea17f6c76d42f431
options:
  platform: psp
  basename: rel_select_card
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_select_card.prx
  asm_path: asm/rel_select_card
  asset_path: assets/rel_select_card   # per-module, or all 28 overwrite each other
  ld_script_path: build/rel_select_card.ld
  symbol_addrs_path: config/symbols/rel_select_card.txt   # import stub names (scripts/resolve_nids.py)
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program headers, file 0x0-0x54
  - name: rel_select_card
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x1844C: the code to decompile
      - [0x184A0, asm, sceStub_text]  # vram 0x1844C-0x1BA54: import-stub trampolines
      - [0x1BAA8, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0x1BAF0, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0x1BB88, bin, sceNid]   # .rodata.sceNid
      - [0x1D68C, bin, data]   # .data
      - [0x1E624, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0x27DF4]   # sentinel: total file size
