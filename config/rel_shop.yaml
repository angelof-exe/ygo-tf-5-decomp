# splat config for rel_shop.prx — full file coverage.
#
# Generated by scripts/module_survey.py; see config/rel_movie_viewer.yaml
# for the hand-written original this mirrors, including the two gotchas
# encoded here: `header` must be its own top-level segment (splat groups
# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x019B20  .text                    (0x19ACC)
#   0x019B20-0x01D128  .sceStub.text            (0x3608)
#   0x01D128-0x01D12C  .lib.ent.top             (0x4)
#   0x01D12C-0x01D14C  .lib.ent                 (0x20)
#   0x01D14C-0x01D150  .lib.ent.btm             (0x4)
#   0x01D150-0x01D154  .lib.stub.top            (0x4)
#   0x01D154-0x01D16C  .lib.stub                (0x18)
#   0x01D16C-0x01D170  .lib.stub.btm            (0x4)
#   0x01D170-0x01D1A4  .rodata.sceModuleInfo    (0x34)
#   0x01D1A4-0x01D1F8  .rodata.sceResident      (0x54)
#   0x01D1F8-0x01ECFC  .rodata.sceNid           (0x1B04)
#   0x01ECFC-0x01ED3C  .rodata.sceVstub         (0x40)
#   0x01ED3C-0x0240F4  .data                    (0x53B8)
#   0x0240F4-0x031190  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0x31190 == 201104 == the file's exact size.

name: rel_shop
sha1: 0b257d4a4d1bf2a0a8bcee8089ccd571649c3338
options:
  platform: psp
  basename: rel_shop
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_shop.prx
  asm_path: asm/rel_shop
  asset_path: assets/rel_shop   # per-module, or all 28 overwrite each other
  ld_script_path: build/rel_shop.ld
  symbol_addrs_path: config/symbols/rel_shop.txt   # import stub names (scripts/resolve_nids.py)
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program headers, file 0x0-0x54
  - name: rel_shop
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x19ACC: the code to decompile
      - [0x19B20, asm, sceStub_text]  # vram 0x19ACC-0x1D0D4: import-stub trampolines
      - [0x1D128, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0x1D170, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0x1D1F8, bin, sceNid]   # .rodata.sceNid
      - [0x1ECFC, bin, sceVstub]   # .rodata.sceVstub
      - [0x1ED3C, bin, data]   # .data
      - [0x240F4, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0x31190]   # sentinel: total file size
