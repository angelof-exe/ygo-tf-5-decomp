# splat config for rel_soundtest.prx — full file coverage.
#
# Generated by scripts/module_survey.py; see config/rel_movie_viewer.yaml
# for the hand-written original this mirrors, including the two gotchas
# encoded here: `header` must be its own top-level segment (splat groups
# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x00163C  .text                    (0x15E8)
#   0x00163C-0x004C44  .sceStub.text            (0x3608)
#   0x004C44-0x004C48  .lib.ent.top             (0x4)
#   0x004C48-0x004C68  .lib.ent                 (0x20)
#   0x004C68-0x004C6C  .lib.ent.btm             (0x4)
#   0x004C6C-0x004C70  .lib.stub.top            (0x4)
#   0x004C70-0x004C88  .lib.stub                (0x18)
#   0x004C88-0x004C8C  .lib.stub.btm            (0x4)
#   0x004C8C-0x004CC0  .rodata.sceModuleInfo    (0x34)
#   0x004CC0-0x004D0C  .rodata.sceResident      (0x4C)
#   0x004D0C-0x006810  .rodata.sceNid           (0x1B04)
#   0x006810-0x0069B4  .data                    (0x1A4)
#   0x0069B4-0x007E50  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0x7E50 == 32336 == the file's exact size.

name: rel_soundtest
sha1: a62d1813be286d71f331fbc46367d252a397fb25
options:
  platform: psp
  basename: rel_soundtest
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_soundtest.prx
  asm_path: asm/rel_soundtest
  asset_path: assets/rel_soundtest   # per-module, or all 28 overwrite each other
  ld_script_path: build/rel_soundtest.ld
  symbol_addrs_path: config/symbols/rel_soundtest.txt   # import stub names (scripts/resolve_nids.py)
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program headers, file 0x0-0x54
  - name: rel_soundtest
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x15E8: the code to decompile
      - [0x163C, asm, sceStub_text]  # vram 0x15E8-0x4BF0: import-stub trampolines
      - [0x4C44, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0x4C8C, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0x4D0C, bin, sceNid]   # .rodata.sceNid
      - [0x6810, bin, data]   # .data
      - [0x69B4, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0x7E50]   # sentinel: total file size
