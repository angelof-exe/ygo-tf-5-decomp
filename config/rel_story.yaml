# splat config for rel_story.prx — full file coverage.
#
# Generated by scripts/module_survey.py; see config/rel_movie_viewer.yaml
# for the hand-written original this mirrors, including the two gotchas
# encoded here: `header` must be its own top-level segment (splat groups
# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x015B5C  .text                    (0x15B08)
#   0x015B5C-0x0193C4  .sceStub.text            (0x3868)
#   0x0193C4-0x0193C8  .lib.ent.top             (0x4)
#   0x0193C8-0x0193E8  .lib.ent                 (0x20)
#   0x0193E8-0x0193EC  .lib.ent.btm             (0x4)
#   0x0193EC-0x0193F0  .lib.stub.top            (0x4)
#   0x0193F0-0x0194F8  .lib.stub                (0x108)
#   0x0194F8-0x0194FC  .lib.stub.btm            (0x4)
#   0x0194FC-0x019530  .rodata.sceModuleInfo    (0x34)
#   0x019530-0x019668  .rodata.sceResident      (0x138)
#   0x019668-0x01B2D0  .rodata.sceNid           (0x1C68)
#   0x01B2D0-0x02A614  .data                    (0xF344)
#   0x02A614-0x03650C  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0x3650C == 222476 == the file's exact size.

name: rel_story
sha1: 1f240e1de50b396693b9daa7dc4ce205601be854
options:
  platform: psp
  basename: rel_story
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_story.prx
  asm_path: asm/rel_story
  asset_path: assets/rel_story   # per-module, or all 28 overwrite each other
  ld_script_path: build/rel_story.ld
  symbol_addrs_path: config/symbols/rel_story.txt   # import stub names (scripts/resolve_nids.py)
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program headers, file 0x0-0x54
  - name: rel_story
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x15B08: the code to decompile
      - [0x15B5C, asm, sceStub_text]  # vram 0x15B08-0x19370: import-stub trampolines
      - [0x193C4, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0x194FC, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0x19668, bin, sceNid]   # .rodata.sceNid
      - [0x1B2D0, bin, data]   # .data
      - [0x2A614, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0x3650C]   # sentinel: total file size
