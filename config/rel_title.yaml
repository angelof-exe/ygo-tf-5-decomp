# splat config for rel_title.prx — full file coverage.
#
# Generated by scripts/module_survey.py; see config/rel_movie_viewer.yaml
# for the hand-written original this mirrors, including the two gotchas
# encoded here: `header` must be its own top-level segment (splat groups
# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x04404C  .text                    (0x43FF8)
#   0x04404C-0x04778C  .sceStub.text            (0x3740)
#   0x04778C-0x047790  .lib.ent.top             (0x4)
#   0x047790-0x0477B0  .lib.ent                 (0x20)
#   0x0477B0-0x0477B4  .lib.ent.btm             (0x4)
#   0x0477B4-0x0477B8  .lib.stub.top            (0x4)
#   0x0477B8-0x047884  .lib.stub                (0xCC)
#   0x047884-0x047888  .lib.stub.btm            (0x4)
#   0x047888-0x0478BC  .rodata.sceModuleInfo    (0x34)
#   0x0478BC-0x047A88  .rodata.sceResident      (0x1CC)
#   0x047A88-0x049A54  .rodata.sceNid           (0x1FCC)
#   0x049A54-0x050634  .data                    (0x6BE0)
#   0x050634-0x05EA74  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0x5EA74 == 387700 == the file's exact size.

name: rel_title
sha1: cccc75ce90cf831d5569b76e5f9bfc0d72e5d166
options:
  platform: psp
  basename: rel_title
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_title.prx
  asm_path: asm/rel_title
  asset_path: assets/rel_title   # per-module, or all 28 overwrite each other
  ld_script_path: build/rel_title.ld
  symbol_addrs_path: config/symbols/rel_title.txt   # import stub names (scripts/resolve_nids.py)
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program headers, file 0x0-0x54
  - name: rel_title
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x43FF8: the code to decompile
      - [0x4404C, asm, sceStub_text]  # vram 0x43FF8-0x47738: import-stub trampolines
      - [0x4778C, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0x47888, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0x47A88, bin, sceNid]   # .rodata.sceNid
      - [0x49A54, bin, data]   # .data
      - [0x50634, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0x5EA74]   # sentinel: total file size
