# splat config for rel_tutorial.prx — full file coverage.
#
# Generated by scripts/module_survey.py; see config/rel_movie_viewer.yaml
# for the hand-written original this mirrors, including the two gotchas
# encoded here: `header` must be its own top-level segment (splat groups
# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x0068C8  .text                    (0x6874)
#   0x0068C8-0x00A6A8  .sceStub.text            (0x3DE0)
#   0x00A6A8-0x00A6AC  .lib.ent.top             (0x4)
#   0x00A6AC-0x00A6CC  .lib.ent                 (0x20)
#   0x00A6CC-0x00A6D0  .lib.ent.btm             (0x4)
#   0x00A6D0-0x00A6D4  .lib.stub.top            (0x4)
#   0x00A6D4-0x00A714  .lib.stub                (0x40)
#   0x00A714-0x00A718  .lib.stub.btm            (0x4)
#   0x00A718-0x00A74C  .rodata.sceModuleInfo    (0x34)
#   0x00A74C-0x00A808  .rodata.sceResident      (0xBC)
#   0x00A808-0x00C6F8  .rodata.sceNid           (0x1EF0)
#   0x00C6F8-0x00CB44  .data                    (0x44C)
#   0x00CB44-0x010574  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0x10574 == 66932 == the file's exact size.

name: rel_tutorial
sha1: 0c9029bffd7e1d9b08dc0ad7e686b5f8ea6c685e
options:
  platform: psp
  basename: rel_tutorial
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_tutorial.prx
  asm_path: asm/rel_tutorial
  asset_path: assets/rel_tutorial   # per-module, or all 28 overwrite each other
  ld_script_path: build/rel_tutorial.ld
  symbol_addrs_path: config/symbols/rel_tutorial.txt   # import stub names (scripts/resolve_nids.py)
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program headers, file 0x0-0x54
  - name: rel_tutorial
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x6874: the code to decompile
      - [0x68C8, asm, sceStub_text]  # vram 0x6874-0xA654: import-stub trampolines
      - [0xA6A8, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0xA718, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0xA808, bin, sceNid]   # .rodata.sceNid
      - [0xC6F8, bin, data]   # .data
      - [0xCB44, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0x10574]   # sentinel: total file size
