# splat config for rel_tutoriallist.prx — full file coverage.
#
# Generated by scripts/module_survey.py; see config/rel_movie_viewer.yaml
# for the hand-written original this mirrors, including the two gotchas
# encoded here: `header` must be its own top-level segment (splat groups
# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x0029D0  .text                    (0x297C)
#   0x0029D0-0x005FD8  .sceStub.text            (0x3608)
#   0x005FD8-0x005FDC  .lib.ent.top             (0x4)
#   0x005FDC-0x005FFC  .lib.ent                 (0x20)
#   0x005FFC-0x006000  .lib.ent.btm             (0x4)
#   0x006000-0x006004  .lib.stub.top            (0x4)
#   0x006004-0x00601C  .lib.stub                (0x18)
#   0x00601C-0x006020  .lib.stub.btm            (0x4)
#   0x006020-0x006054  .rodata.sceModuleInfo    (0x34)
#   0x006054-0x0060A8  .rodata.sceResident      (0x54)
#   0x0060A8-0x007BAC  .rodata.sceNid           (0x1B04)
#   0x007BAC-0x007C54  .data                    (0xA8)
#   0x007C54-0x0090F4  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0x90F4 == 37108 == the file's exact size.

name: rel_tutoriallist
sha1: fc7f5cfa20cb5b951bcf1d3eb85aa8f249828783
options:
  platform: psp
  basename: rel_tutoriallist
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_tutoriallist.prx
  asm_path: asm/rel_tutoriallist
  asset_path: assets/rel_tutoriallist   # per-module, or all 28 overwrite each other
  ld_script_path: build/rel_tutoriallist.ld
  symbol_addrs_path: config/symbols/rel_tutoriallist.txt   # import stub names (scripts/resolve_nids.py)
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program headers, file 0x0-0x54
  - name: rel_tutoriallist
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x297C: the code to decompile
      - [0x29D0, asm, sceStub_text]  # vram 0x297C-0x5F84: import-stub trampolines
      - [0x5FD8, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0x6020, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0x60A8, bin, sceNid]   # .rodata.sceNid
      - [0x7BAC, bin, data]   # .data
      - [0x7C54, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0x90F4]   # sentinel: total file size
