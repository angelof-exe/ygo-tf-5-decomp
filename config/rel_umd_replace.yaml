# splat config for rel_umd_replace.prx — full file coverage.
#
# Generated by scripts/module_survey.py; see config/rel_movie_viewer.yaml
# for the hand-written original this mirrors, including the two gotchas
# encoded here: `header` must be its own top-level segment (splat groups
# bin subsegments of a code segment into the DATA block, i.e. after .text),
# and .text + .sceStub.text must stay in ONE contiguous code segment based
# at file 0x54 / vram 0x0 so func_XXXXXXXX names are offsets from the start
# of the code segment.
#
# Section layout (`readelf -SW`, file offsets):
#   0x000054-0x003A60  .text                    (0x3A0C)
#   0x003A60-0x0070E8  .sceStub.text            (0x3688)
#   0x0070E8-0x0070EC  .lib.ent.top             (0x4)
#   0x0070EC-0x00710C  .lib.ent                 (0x20)
#   0x00710C-0x007110  .lib.ent.btm             (0x4)
#   0x007110-0x007114  .lib.stub.top            (0x4)
#   0x007114-0x00717C  .lib.stub                (0x68)
#   0x00717C-0x007180  .lib.stub.btm            (0x4)
#   0x007180-0x0071B4  .rodata.sceModuleInfo    (0x34)
#   0x0071B4-0x0072E8  .rodata.sceResident      (0x134)
#   0x0072E8-0x00926C  .rodata.sceNid           (0x1F84)
#   0x00926C-0x009734  .data                    (0x4C8)
#   0x009734-0x00B8F4  section header table + .rel.* + .shstrtab + .comment
#
# Ranges sum to 0xB8F4 == 47348 == the file's exact size.

name: rel_umd_replace
sha1: 7a541f823f2e49dd2000af18c278e70464ab99f5
options:
  platform: psp
  basename: rel_umd_replace
  base_path: ..
  target_path: iso_extracted/PSP_GAME/USRDIR/gmodule/rel_umd_replace.prx
  asm_path: asm/rel_umd_replace
  asset_path: assets/rel_umd_replace   # per-module, or all 28 overwrite each other
  ld_script_path: build/rel_umd_replace.ld
  symbol_addrs_path: config/symbols/rel_umd_replace.txt   # import stub names (scripts/resolve_nids.py)
  compiler: GCC          # placeholder to drive the disassembler; the game uses MWCC (see docs/06)
  find_file_boundaries: True
  add_set_gp_64: False   # Allegrex is 32-bit; `.set gp=64` makes gas reject -march=mips32r2
  ld_align_section_vram_end: False   # a 16-byte ALIGN between blocks shifts everything after .text
  ld_align_segment_vram_end: False
  emit_subalign: False   # SUBALIGN(16) would pad every blob and change the file size
  section_order: [".text", ".data", ".rodata", ".bss"]

segments:
  - [0x0, bin, header]   # ELF header + program headers, file 0x0-0x54
  - name: rel_umd_replace
    type: code
    start: 0x54
    vram: 0x0
    subsegments:
      - [0x54, asm, text]          # vram 0x0-0x3A0C: the code to decompile
      - [0x3A60, asm, sceStub_text]  # vram 0x3A0C-0x7094: import-stub trampolines
      - [0x70E8, bin, lib_tables]   # .lib.ent.top + .lib.ent + .lib.ent.btm + .lib.stub.top + .lib.stub + .lib.stub.btm
      - [0x7180, bin, module_info]   # .rodata.sceModuleInfo + .rodata.sceResident
      - [0x72E8, bin, sceNid]   # .rodata.sceNid
      - [0x926C, bin, data]   # .data
      - [0x9734, bin, elf_meta]   # section header table + .rel.* + .shstrtab + .comment
  - [0xB8F4]   # sentinel: total file size
